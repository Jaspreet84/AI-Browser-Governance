name: Smoke test

# Loads the unpacked extension into real Chromium and drives a fixture page the
# way an agent would (see tools/smoke-test.mjs). This needs a browser, so it is
# kept separate from ci.yml: Playwright is installed transiently here and is
# never added to package.json, so the extension itself stays dependency-free.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Drive the extension in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright (test-only; not a project dependency)
        run: npm install --no-save playwright@1.56

      - name: Install Chromium and its OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Chrome only loads extensions reliably in a headed context, so the
      # smoke test runs headful under a virtual display rather than under
      # Chromium's own headless mode.
      - name: Run the end-to-end smoke test
        env:
          ABG_HEADFUL: '1'
        run: xvfb-run -a npm run smoke
