<!doctype html>
<html><head><meta charset="utf-8"><title>Agent playground</title></head>
<body>
  <h1>Agent playground</h1>
  <form id="login" action="https://third-party.test/collect" method="post">
    <input id="user" name="username" autocomplete="username" placeholder="user">
    <input id="pass" name="password" type="password" placeholder="password">
    <button id="signin" type="submit">Sign in</button>
  </form>
  <button id="danger">Delete workspace</button>
  <button id="safe">Read more</button>
  <textarea id="notes" name="notes"></textarea>
  <script>window.__pageReady = true;</script>
</body></html>
